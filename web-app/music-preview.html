<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音乐预览</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='8'%20fill='%23070707'/%3E%3Cpath%20d='M32%2010a22%2022%200%201%200%200%2044%2022%2022%200%200%200%200-44Zm0%208v15l10%207'%20fill='none'%20stroke='%23f4d35e'%20stroke-width='5'%20stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="dns-prefetch" href="https://assets-apac.25thgame.vip" />
    <link rel="dns-prefetch" href="https://assets-cn.25thgame.vip" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://assets-apac.25thgame.vip" crossorigin />
    <link rel="preconnect" href="https://assets-cn.25thgame.vip" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      :root {
        color-scheme: light;
        --ink: #241b16;
        --muted: #766a60;
        --line: #d8cdc0;
        --paper: #f6efe4;
        --panel: #fffaf1;
        --accent: #2d6cdf;
        --accent-soft: #dfe9ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }

      button,
      input {
        font: inherit;
      }

      .preview-shell {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        min-height: 100vh;
      }

      .track-panel {
        border-right: 1px solid var(--line);
        background: #fbf5eb;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
      }

      .panel-head,
      .player-panel {
        padding: 20px;
      }

      .panel-head h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }

      .panel-head p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .filters {
        display: grid;
        gap: 10px;
        padding: 0 20px 16px;
      }

      .filters input,
      .filters select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--ink);
        background: var(--panel);
      }

      .track-list {
        margin: 0;
        padding: 0 12px 18px;
        overflow: auto;
        list-style: none;
      }

      .track-button {
        width: 100%;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px;
        color: var(--ink);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .track-button:hover,
      .track-button:focus-visible,
      .track-button.is-active {
        border-color: #b6c9f5;
        background: var(--accent-soft);
        outline: none;
      }

      .track-cover {
        inline-size: 44px;
        block-size: 44px;
        border-radius: 6px;
        border: 1px solid var(--line);
        object-fit: cover;
        background: #eee2d2;
      }

      .track-name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .track-meta,
      .track-volume {
        color: var(--muted);
        font-size: 12px;
      }

      .player-panel {
        display: grid;
        align-content: center;
        gap: 18px;
      }

      .music-box {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: var(--panel);
        box-shadow: 0 18px 50px rgb(71 48 28 / 0.12);
      }

      .now-playing {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
      }

      .now-cover {
        inline-size: 92px;
        block-size: 92px;
        border-radius: 8px;
        border: 1px solid var(--line);
        object-fit: cover;
        background: #eee2d2;
      }

      .now-title {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      .now-meta,
      .now-volume {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .controls {
        display: grid;
        grid-template-columns: auto auto minmax(130px, 1fr);
        gap: 10px;
        align-items: center;
        margin-top: 18px;
      }

      .control-button {
        border: 1px solid #acc0ea;
        border-radius: 6px;
        padding: 9px 12px;
        color: #173b80;
        background: #eef4ff;
        cursor: pointer;
      }

      .control-button:disabled {
        color: #8e8a84;
        background: #eee9e2;
        cursor: default;
      }

      .progress-row,
      .volume-row {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr) 64px;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }

      input[type="range"] {
        width: 100%;
      }

      .status-line {
        min-height: 20px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .audit-panel {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff7e8;
      }

      .audit-panel summary {
        cursor: pointer;
        font-weight: 700;
      }

      .audit-output {
        max-height: 260px;
        overflow: auto;
        margin: 12px 0 0;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
      }

      @media (max-width: 820px) {
        .preview-shell {
          grid-template-columns: 1fr;
        }

        .track-panel {
          max-height: 48vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .controls,
        .progress-row,
        .volume-row,
        .now-playing {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <aside class="track-panel">
        <header class="panel-head">
          <h1>音乐预览</h1>
          <p data-count>正在加载曲库</p>
        </header>
        <div class="filters">
          <input data-search type="search" placeholder="搜索歌名、来源或编号" autocomplete="off" />
          <select data-group-filter aria-label="曲目分组"></select>
        </div>
        <ul class="track-list" data-track-list></ul>
      </aside>
      <section class="player-panel" aria-label="音乐播放器">
        <div class="music-box">
          <div class="now-playing">
            <img class="now-cover" data-now-cover alt="" />
            <div>
              <h2 class="now-title" data-now-title>请选择曲目</h2>
              <p class="now-meta" data-now-meta></p>
              <p class="now-volume" data-now-volume></p>
            </div>
          </div>
          <div class="controls">
            <button class="control-button" type="button" data-prev>上一首</button>
            <button class="control-button" type="button" data-toggle>播放</button>
            <button class="control-button" type="button" data-next>下一首</button>
          </div>
          <div class="progress-row">
            <span>进度</span>
            <input data-progress type="range" min="0" max="1000" value="0" />
            <span data-time>0:00</span>
          </div>
          <div class="volume-row">
            <span>监听音量</span>
            <input data-master-volume type="range" min="0" max="100" value="100" />
            <span data-master-volume-text>100%</span>
          </div>
          <p class="status-line" data-status></p>
          <audio data-audio preload="auto"></audio>
        </div>
        <details class="audit-panel">
          <summary>响度测试</summary>
          <button class="control-button" type="button" data-audit>测量全部曲目</button>
          <pre class="audit-output" data-audit-output></pre>
        </details>
      </section>
    </main>
    <script type="module" src="./music-preview.mjs"></script>
  </body>
</html>
