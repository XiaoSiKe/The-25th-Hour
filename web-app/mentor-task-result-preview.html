<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>游戏 UI 预览</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./mentor-task-result-preview.css" />
  </head>
  <body>
    <main class="preview-root" data-preview-root>
      <section class="preview-fallback">
        <h1>游戏 UI 预览</h1>
        <p>正在加载导师任务、汇报结果、评图结果与考试题目页面。</p>
      </section>
    </main>
    <script type="module">
      import("./mentor-task-result-preview.mjs").catch((error) => {
        const root = document.querySelector("[data-preview-root]");
        if (!root) return;
        root.innerHTML = `
          <section class="preview-fallback">
            <h1>游戏 UI 预览加载失败</h1>
            <p>请通过本地服务地址打开：<br>http://localhost:4174/mentor-task-result-preview.html</p>
            <pre>${String(error?.message ?? error)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")}</pre>
          </section>
        `;
      });
    </script>
  </body>
</html>
