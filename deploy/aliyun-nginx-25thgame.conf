server {
  server_name arch.25thgame.vip;

  root /var/www/25thgame/current;
  index index.html;
  resolver 223.5.5.5 223.6.6.6 valid=300s ipv6=off;

  add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location = /sw.mjs {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location = /sw-cache-policy.mjs {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location = /api {
    set $monitor_api_host world.25thgame.vip;
    proxy_pass https://$monitor_api_host$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name $monitor_api_host;
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
    proxy_set_header Host $monitor_api_host;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location ^~ /api/ {
    set $monitor_api_host world.25thgame.vip;
    proxy_pass https://$monitor_api_host$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name $monitor_api_host;
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
    proxy_set_header Host $monitor_api_host;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location ~* "^/assets/v[0-9]+/" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location ^~ /optimized/asset-work/assets/audio/ending-tracks/ {
    types {
      audio/mp4 m4a;
      text/plain lrc;
    }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location ~* "^/(build|optimized|asset-work/assets/fonts/aa-pixel)/.*\.[a-f0-9]{12}\.[^/]+$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location ~* \.(?:html)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/ /index.html;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/arch.25thgame.vip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arch.25thgame.vip/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  server_name arch.25thgame.vip;
  return 301 https://$host$request_uri;
}
